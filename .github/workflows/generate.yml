name: Generate Weekly Puzzles
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run generate
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - run: npm run export
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - run: |
          git config user.name "flickfive-bot"
          git config user.email "bot@flickfive.app"
          git add data/archive.enc public/data
          git diff --cached --quiet || git commit -m "Generate FlickFive puzzles"
          git push
