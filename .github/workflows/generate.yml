name: Generate Weekly Puzzles
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run generate
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - run: npm run export
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - run: node scripts/check-publish.js
      - run: |
          git config user.name "flickfive-bot"
          git config user.email "bot@flickfive.app"
          git add data/archive.enc public/data
          git diff --cached --quiet || git commit -m "Generate FlickFive puzzles"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
